  <circle
    cx="81"
    cy="55"
    r="3.2"
    stroke="#00F0FF"
    stroke-width="1.8"
    fill="#081426"
    filter="url(#kc-neon-glow)"
  />
  <circle cx="81" cy="55" r="1.0" fill="#00F0FF" />

  <path
    d="M 82 61 A 24 24 0 0 1 84 67"
    stroke="url(#kc-cyan-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
